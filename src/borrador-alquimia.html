<!doctype html>
<meta charset="utf-8">
<style>
@font-face{font-family:'Playfair';src:url('../assets/fonts/PlayfairDisplay-Bold.ttf') format('truetype');font-weight:700}
@font-face{font-family:'Manrope';src:url('../assets/fonts/Manrope-Regular.ttf') format('truetype');font-weight:400}
@font-face{font-family:'Manrope';src:url('../assets/fonts/Manrope-ExtraBold.ttf') format('truetype');font-weight:800}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden}
body{font-family:'Manrope',sans-serif;background:#E9E4DA;color:#2A2621;position:relative}

.bg{position:absolute;inset:0;
  background:radial-gradient(1200px 1000px at 50% 22%, #F2EEE6 0%, #E9E4DA 55%, #DFD8CB 100%)}
.grain{position:absolute;inset:0;opacity:.30;mix-blend-mode:multiply;
  background-image:radial-gradient(#B9AF9E 1px, transparent 1px);background-size:5px 5px}
.hair{position:absolute;left:50%;transform:translateX(-50%);width:1px;background:#2A2621;opacity:.14}
.h1{top:296px;height:88px}
.h2{bottom:418px;height:80px}

.wrap{position:absolute;inset:0;padding:250px 110px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}

/* ── Marca ───────────────────────────── */
.mark{margin-top:0}
.mark svg{width:118px;height:118px;display:block}
.brand{margin-top:44px;font-family:'Playfair',serif;font-weight:700;
  font-size:78px;line-height:1;letter-spacing:.14em;text-indent:.14em;color:#2A2621}
.brand .cru{display:block;margin-top:16px;font-size:78px;letter-spacing:.42em;text-indent:.42em;color:#96714C}

/* ── Mensaje ─────────────────────────── */
.eyebrow{margin-top:104px;font-size:26px;font-weight:800;letter-spacing:.34em;
  text-indent:.34em;color:#7C7466;text-transform:uppercase}
.msg{margin-top:34px;font-family:'Playfair',serif;font-weight:700;
  font-size:74px;line-height:1.16;letter-spacing:-.01em;max-width:800px}
.msg em{font-style:italic;color:#96714C}

.facts{margin-top:70px;display:flex;align-items:stretch;gap:0}
.fact{padding:0 56px;display:flex;flex-direction:column;justify-content:center}
.fact+.fact{border-left:1px solid rgba(42,38,33,.18)}
.fnum{font-family:'Playfair',serif;font-weight:700;font-size:66px;line-height:1;color:#2A2621}
.fnum b{color:#96714C;font-weight:700}
.flab{margin-top:16px;font-size:24px;font-weight:800;letter-spacing:.18em;
  text-indent:.18em;color:#7C7466;text-transform:uppercase}

/* ── CTA ─────────────────────────────── */
.cta{margin-top:104px;display:inline-flex;align-items:center;gap:20px;align-self:center;
  padding:32px 64px;border-radius:100px;border:1.5px solid #2A2621;background:transparent}
.cta span{font-size:32px;font-weight:800;letter-spacing:.16em;text-indent:.16em;text-transform:uppercase}
.cta svg{width:32px;height:32px}
</style>

<div class="bg"></div><div class="grain"></div>
<div class="hair h1"></div><div class="hair h2"></div>

<div class="wrap">
  <div class="mark">
    <!-- monograma: circulo + triangulo alquimico -->
    <svg viewBox="0 0 100 100" fill="none">
      <circle cx="50" cy="50" r="47" stroke="#2A2621" stroke-width="1.6" stroke-opacity=".55"/>
      <path d="M50 24 L74 68 H26 Z" stroke="#96714C" stroke-width="2.4"
            stroke-linejoin="round" fill="none"/>
      <path d="M34 56 H66" stroke="#96714C" stroke-width="2.4" stroke-linecap="round"/>
    </svg>
  </div>

  <div class="brand">ALQUIMIA<span class="cru">CRU</span></div>

  <div class="eyebrow">Oportunidad de inversión</div>
  <h1 class="msg">Invierte<br>con <em>nosotros</em>.</h1>

  <div class="facts">
    <div class="fact">
      <div class="fnum">Desde <b>$20K</b></div>
      <div class="flab">MXN</div>
    </div>
    <div class="fact">
      <div class="fnum"><b>30%</b></div>
      <div class="flab">Anual</div>
    </div>
  </div>

  <div class="cta">
    <svg viewBox="0 0 24 24" fill="none" stroke="#2A2621" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 9 9 0 0 1-3.9-.9L3 20.5l1.6-4.8A8.4 8.4 0 0 1 3.6 11 8.5 8.5 0 0 1 12 3a8.4 8.4 0 0 1 9 8.5z"/></svg>
    <span>DM para detalles</span>
  </div>
</div>
