<!doctype html>
<meta charset="utf-8">
<style>
@font-face{font-family:'Cormorant';src:url('../assets/fonts/CormorantGaramond-Light.ttf') format('truetype');font-weight:300}
@font-face{font-family:'Cormorant';src:url('../assets/fonts/CormorantGaramond-Regular.ttf') format('truetype');font-weight:400}
@font-face{font-family:'Jost';src:url('../assets/fonts/Jost-Regular.ttf') format('truetype');font-weight:100 700}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden}

:root{
  --oro:#C0873B;      /* dorado del logo */
  --tinta:#0E0E0E;    /* negro del wordmark */
  --papel:#FFFFFF;    /* blanco del logo */
  --gris:#8A8478;
}
body{font-family:'Jost',sans-serif;background:var(--papel);color:var(--tinta);position:relative}
.bg{position:absolute;inset:0;background:
  radial-gradient(1100px 900px at 50% 26%, #FFFFFF 0%, #FCFAF6 62%, #F6F1E8 100%)}

.wrap{position:absolute;inset:0;padding:230px 130px 290px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}

/* ── Lockup de marca ─────────────────── */
.emblema{width:250px;height:286px}
.wordmark{margin-top:52px;font-family:'Cormorant',serif;font-weight:400;
  font-size:88px;line-height:1;letter-spacing:.22em;text-indent:.22em;color:var(--tinta)}
.cru{margin-top:22px;display:flex;align-items:center;gap:30px;width:660px}
.cru i{flex:1;height:1px;background:var(--oro);opacity:.85}
.cru span{font-family:'Cormorant',serif;font-weight:400;font-size:46px;
  letter-spacing:.46em;text-indent:.46em;color:var(--oro)}

/* ── Mensaje ─────────────────────────── */
.eyebrow{margin-top:126px;font-size:25px;font-weight:500;letter-spacing:.36em;
  text-indent:.36em;color:var(--gris);text-transform:uppercase}
.msg{margin-top:132px;font-family:'Cormorant',serif;font-weight:400;
  font-size:92px;line-height:1.12;letter-spacing:.01em}
.msg em{font-style:italic;color:var(--oro)}

.facts{margin-top:72px;display:flex;align-items:center}
.fact{padding:0 62px}
.fact+.fact{border-left:1px solid rgba(14,14,14,.14)}
.fnum{font-family:'Cormorant',serif;font-weight:400;font-size:70px;line-height:1;color:var(--oro)}
.flab{margin-top:14px;font-size:23px;font-weight:400;letter-spacing:.22em;
  text-indent:.22em;color:var(--gris);text-transform:uppercase}

/* ── CTA ─────────────────────────────── */
.cta{margin-top:100px;padding:30px 76px;background:var(--oro);border-radius:2px}
.cta span{font-size:29px;font-weight:500;letter-spacing:.26em;
  text-indent:.26em;color:#fff;text-transform:uppercase}
</style>

<div class="bg"></div>

<div class="wrap">
  <svg class="emblema" viewBox="0 0 240 274" fill="none">
    <g stroke="#C0873B" stroke-width="3.4" stroke-linejoin="round" stroke-linecap="round">
      <path d="M74 6 H166"/><path d="M79 21 H161"/>
      <path d="M74 6 L79 21"/><path d="M166 6 L161 21"/>
      <path d="M79 21 L30 238 C27 252 20 258 8 260 H74 C67 256 64 250 65 238 L120 36"/>
      <path d="M161 21 L210 238 C213 252 220 258 232 260 H166 C173 256 176 250 175 238 L120 36"/>
      <path d="M4 264 H78"/><path d="M162 264 H236"/>
      <path d="M120 150 C120 150 138 176 138 190 C138 200 130 208 120 208 C110 208 102 200 102 190 C102 176 120 150 120 150 Z"/>
    </g>
  </svg>

  <div class="wordmark">ALQUIMIA</div>
  <div class="cru"><i></i><span>CRU</span><i></i></div>

  <div class="msg">Buscamos<br><em>inversionistas</em>.</div>

  <div class="facts">
    <div class="fact">
      <div class="fnum">$20,000</div>
      <div class="flab">Desde · MXN</div>
    </div>
    <div class="fact">
      <div class="fnum">30%</div>
      <div class="flab">Retorno anual</div>
    </div>
  </div>

  <div class="cta"><span>DM para detalles</span></div>
</div>
